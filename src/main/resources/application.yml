server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: sqlpas
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: drop-and-create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialec
        format_sql: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:data/db-changelog-master.xml
#  http://localhost:8080/swagger-ui.html.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: epam.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json