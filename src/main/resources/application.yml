spring:
  application:
    name: orm-application
  datasource:
    username: root
    password: sqlpas
    url: jdbc:mysql://localhost:3306/orm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
      show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:data/db-changelog-master.xml
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      accept-single-value-as-array: true