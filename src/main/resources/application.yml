#  http://localhost:8080/swagger-ui.html.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: epam.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json